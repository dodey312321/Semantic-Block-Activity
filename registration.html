     <section class="registration">
        <form class="form1">
            <h3>REGISTRATION</h3>
            First name:  <input type="text" name="first_name" /> Last name:  <input type="text" name="last_name" />
            <br>
            <br>    
            User ID :  <input type="text" name="user_id" /> Password:  <input type="password" name="password" />

            <br>

            <input type="checkbox" name="male" value="on"> Male
            <input type="checkbox" name="female" value="on"> Female

            <input type="radio" name="civilstatus" value="physics"> Married

            <br>
            <textarea rows="5" cols="40" name="description" placeholder="Enter here..."></textarea>
            <h3>OTHERS:</h3>
            <select name="dropdown">
            <option value="Maths" selected>Maths</option>
            <option value="Physics">Physics</option>
            </select>

            <input type="file" name="fileupload" accept="image/*" />
            <br> <br>
            <input type="submit" name="submit" value="Submit" />
            <input type="reset" name="reset"  value="Reset" />
